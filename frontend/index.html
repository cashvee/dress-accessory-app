<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accessory Recommender</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Upload Your Dress</h1>

    <p class="instructions">
  1. Upload a photo of your dress (clear and well-lit)<br>
  2. Click <strong>“Get Recommendations”</strong><br>
  3. Get matching accessory suggestions instantly ✨
</p>


    <input type="file" id="upload-input" />
    <button id="recommend-btn">Get Recommendations</button>
    <div id="result-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
